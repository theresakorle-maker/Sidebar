<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufklappbare Sidebar</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <button id="openSidebarBtn" class="toggle-btn">
        ☰ Menü
    </button>

    <aside id="mySidebar" class="sidebar">
        <button id="closeSidebarBtn" class="close-btn">&times;</button>
        <nav class="sidebar-content">
            <a href="#">Startseite</a>
            <a href="#">Über uns</a>
            <a href="#">Dienste</a>
            <a href="#">Kontakt</a>
        </nav>
    </aside>
  
    <main class="content">
        <h1>Willkommen</h1>
        <p>Klicken Sie auf den Menü-Button oben links, um die Sidebar zu öffnen.</p>
    </main>

    <script src=main.js"></script>
</body>
</html>
